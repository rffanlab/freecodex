name: FreeCodex Fix CI Batch 3

on:
  push:
    branches:
      - freecodex
    paths:
      - ".github/workflows/freecodex-fix-ci-batch3.yml"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fix-and-check:
    if: ${{ contains(github.event.head_commit.message, 'compatibility fixes batch 3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout freecodex
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: freecodex
          fetch-depth: 0

      - name: Apply upstream compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              if count == 0:
                  raise SystemExit(f"{path}: replacement target not found: {old!r}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          session = "codex-rs/core/src/session/session.rs"
          replace(
              session,
              """            let executed_tool_calls = config\n                .features\n                .enabled(Feature::ExecutedToolCallMetadata)\n                .then(|| Arc::new(crate::state::ExecutedToolCallRecorder::default()));\n""",
              """            let executed_tool_calls = crate::state::ExecutedToolCalls::new(&config.features);\n""",
              expected=1,
          )
          replace(
              session,
              """                models_manager: Arc::clone(&models_manager),\n                tool_approvals:""",
              """                models_manager: Arc::clone(&models_manager),\n                git_root_discovery,\n                tool_approvals:""",
              expected=1,
          )

          replace(
              "codex-rs/core/src/tools/handlers/apply_patch.rs",
              "native_cwd.as_path(),",
              "context.cwd,",
              expected=1,
          )
          replace(
              "codex-rs/core/src/tools/handlers/unified_exec/exec_command.rs",
              "permission_cwd.as_path(),",
              "&cwd,",
              expected=1,
          )
          replace(
              "codex-rs/core/src/tools/handlers/mod.rs",
              "mod wait_for_environment;\n\nuse codex_file_system::FileSystemSandboxContext;",
              "mod wait_for_environment;\n\nuse std::path::Path;\n\nuse codex_file_system::FileSystemSandboxContext;",
              expected=1,
          )

          tests = "codex-rs/codex-mcp/src/elicitation_tests.rs"
          replace(
              tests,
              "manager.make_sender(server_name.to_string(), Some(tx_event))",
              "manager.make_sender(\n        server_name.to_string(),\n        Some(tx_event),\n        &ClientMcpExtensions::default(),\n    )",
              expected=1,
          )
          replace(
              tests,
              "manager.make_sender(\"local-actor\".to_string(), Some(tx_event))",
              "manager.make_sender(\n        \"local-actor\".to_string(),\n        Some(tx_event),\n        &ClientMcpExtensions::default(),\n    )",
              expected=4,
          )
          replace(
              tests,
              "second_manager.make_sender(\"local-actor\".to_string(), Some(second_tx_event))",
              "second_manager.make_sender(\n            \"local-actor\".to_string(),\n            Some(second_tx_event),\n            &ClientMcpExtensions::default(),\n        )",
              expected=1,
          )
          PY

          rm .github/workflows/freecodex-fix-ci-batch3.yml
          git config user.name "freecodex-fix-bot"
          git config user.email "freecodex-fix-bot@users.noreply.github.com"
          git add codex-rs .github/workflows/freecodex-fix-ci-batch3.yml
          git commit -m "fix: adapt FreeCodex to current upstream APIs"
          git push origin HEAD:freecodex

      - name: Prepare Codex CI environment
        id: setup_ci
        uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Configure rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Check modified core packages
        working-directory: codex-rs
        run: cargo check -p codex-mcp -p codex-core -p codex-cli --all-targets
