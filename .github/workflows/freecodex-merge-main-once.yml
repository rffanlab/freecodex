name: FreeCodex Merge Main Once

on:
  push:
    branches:
      - freecodex

permissions:
  contents: write

jobs:
  merge-main:
    if: ${{ !contains(github.event.head_commit.message, '[merge-main-once]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout freecodex
        uses: actions/checkout@v4
        with:
          ref: freecodex
          fetch-depth: 0

      - name: Merge main into freecodex
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freecodex-merge-bot"
          git config user.email "freecodex-merge-bot@users.noreply.github.com"
          git fetch origin main freecodex
          git merge origin/main --no-ff -X ours -m "Merge main into freecodex [merge-main-once]"
          git rm .github/workflows/freecodex-merge-main-once.yml
          git commit --amend --no-edit
          git push origin HEAD:freecodex
