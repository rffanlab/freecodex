name: FreeCodex Fix TUI Formatting

on:
  push:
    branches:
      - freecodex
    paths:
      - .github/workflows/freecodex-fix-pathuri.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: freecodex
          fetch-depth: 0

      - name: Apply rustfmt-compatible speech marker formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('codex-rs/tui/src/history_cell/messages.rs')
          text = path.read_text()
          old = '                message_initial_indent(if self.spoken { "› ".red().bold() } else { "› ".bold().dim() }, self.timestamp.as_ref()),\n'
          new = '                message_initial_indent(\n                    if self.spoken {\n                        "› ".red().bold()\n                    } else {\n                        "› ".bold().dim()\n                    },\n                    self.timestamp.as_ref(),\n                ),\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one unformatted speech marker, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- codex-rs/tui/src/history_cell/messages.rs
          git config user.name "freecodex-fix-bot"
          git config user.email "freecodex-fix-bot@users.noreply.github.com"
          git add codex-rs/tui/src/history_cell/messages.rs
          git commit -m "style(tui): format speech timestamp marker"
          git push origin HEAD:freecodex
