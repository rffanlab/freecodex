name: FreeCodex Fix PathUri Compatibility

on:
  push:
    branches:
      - freecodex
    paths:
      - .github/workflows/freecodex-fix-pathuri.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: freecodex
          fetch-depth: 0

      - name: Patch remaining PathUri call site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/core/src/tools/handlers/extension_tools.rs')
          text = path.read_text()
          old = '            native_cwd.as_path(),\n'
          new = '            environment.cwd(),\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one extension PathUri call site, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- codex-rs/core/src/tools/handlers/extension_tools.rs

          git config user.name "freecodex-fix-bot"
          git config user.email "freecodex-fix-bot@users.noreply.github.com"
          git add codex-rs/core/src/tools/handlers/extension_tools.rs
          git commit -m "fix(core): pass PathUri to extension permission lookup"
          git push origin HEAD:freecodex
