name: Apply FreeCodex provider fallback

on:
  push:
    branches:
      - freecodex
    paths:
      - ".github/workflows/apply-freecodex-provider-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-freecodex-provider-fallback
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate provider fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout freecodex
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: freecodex
          fetch-depth: 0

      - name: Materialize strict patch script
        shell: bash
        working-directory: .
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          mkdir -p tools/freecodex
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > tools/freecodex/apply_provider_fallback.py
          python3 -m py_compile tools/freecodex/apply_provider_fallback.py
          python3 tools/freecodex/apply_provider_fallback.py
          rm tools/freecodex/apply_provider_fallback.py
          rmdir tools/freecodex 2>/dev/null || true

      - name: Prepare Codex CI environment
        id: setup_ci
        uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Configure rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Format patched Rust
        run: cargo fmt -- --config imports_granularity=Item

      - name: Regenerate config schema
        run: cargo run -p codex-core --bin codex-write-config-schema

      - name: Run focused fallback tests
        run: cargo test -p codex-core provider_fallback -- --nocapture

      - name: Validate diff
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit provider fallback
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "freecodex-ci"
          git config user.email "freecodex-ci@users.noreply.github.com"
          git add codex-rs/config/src/config_toml.rs \
                  codex-rs/core/src/client.rs \
                  codex-rs/core/src/client_tests.rs \
                  codex-rs/core/src/session/session.rs \
                  codex-rs/core/config.schema.json
          git commit -m "feat(core): fail over to compatible provider on quota exhaustion"
          git push origin HEAD:freecodex
