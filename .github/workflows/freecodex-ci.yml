name: FreeCodex CI

on:
  push:
    branches:
      - freecodex
    paths:
      - ".github/workflows/freecodex-ci.yml"

permissions:
  contents: write

jobs:
  repair-session-merge:
    name: Repair session merge conflict
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: freecodex
          fetch-depth: 2

      - name: Repair and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/core/src/session/mod.rs')
          text = path.read_text()
          broken = '''                let response = RequestPermissionsResponse {
                    permissions,
                    scope,
                    strict_auto_review: false,
                },
                ReviewDecision::NetworkPolicyAmendment {
                    network_policy_amendment,
                } => match network_policy_amendment.action {
                    NetworkPolicyRuleAction::Allow => RequestPermissionsResponse {
                        permissions: requested_permissions.clone(),
                        scope: PermissionGrantScope::Turn,
                        strict_auto_review: false,
                    },
                    NetworkPolicyRuleAction::Deny => RequestPermissionsResponse {
                        permissions: RequestPermissionProfile::default(),
                        scope: PermissionGrantScope::Turn,
                        strict_auto_review: false,
                    },
                },
                ReviewDecision::ApprovedMcpPolicyAmendment
                | ReviewDecision::Abort
                | ReviewDecision::Denied { .. }
                | ReviewDecision::TimedOut => RequestPermissionsResponse {
                    permissions: RequestPermissionProfile::default(),
                    scope: PermissionGrantScope::Turn,
                    strict_auto_review: false,
                },
            };
            let response = Self::normalize_request_permissions_response(
                requested_permissions,
                response,
                native_environment_cwd.as_path(),
            );
            self.record_granted_request_permissions_for_turn(
                &response,
                &environment,
                originating_turn_state.as_ref(),
            )
            .await;
            return Some(response);
        }
'''
          fixed = '''                let response = RequestPermissionsResponse {
                    permissions,
                    scope,
                    strict_auto_review: false,
                };
                let response = Self::normalize_request_permissions_response(
                    requested_permissions,
                    response,
                    &context,
                );
                self.record_granted_request_permissions_for_turn(
                    &response,
                    &environment.selection,
                    originating_turn_state.as_ref(),
                )
                .await;
                return Some(response);
            }
'''
          count = text.count(broken)
          if count != 1:
              raise SystemExit(f'expected exactly one broken merged block, found {count}')
          text = text.replace(broken, fixed)
          old_notify = '''                self.record_granted_request_permissions_for_turn(
                    &response,
                    &entry.environment,
                    originating_turn_state.as_ref(),
                )'''
          new_notify = '''                self.record_granted_request_permissions_for_turn(
                    &response,
                    &entry.environment.selection,
                    originating_turn_state.as_ref(),
                )'''
          count = text.count(old_notify)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy notify call, found {count}')
          path.write_text(text.replace(old_notify, new_notify, 1))
          PY

          git show HEAD^:.github/workflows/freecodex-ci.yml > .github/workflows/freecodex-ci.yml
          rm -f .github/workflows/freecodex-fix-session-merge-once.yml
          git config user.name 'freecodex-fix-bot'
          git config user.email 'freecodex-fix-bot@users.noreply.github.com'
          git add codex-rs/core/src/session/mod.rs .github/workflows/freecodex-ci.yml
          git add -u .github/workflows/freecodex-fix-session-merge-once.yml || true
          git commit -m 'fix(core): resolve request permissions merge conflict'
          git push origin HEAD:freecodex
