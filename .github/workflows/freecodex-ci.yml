name: FreeCodex CI

on:
  push:
    branches:
      - freecodex
    paths:
      - ".github/workflows/freecodex-ci.yml"

permissions:
  contents: write

jobs:
  repair-session-merge:
    name: Repair session merge conflict
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: freecodex
          fetch-depth: 1

      - name: Repair Rust source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("codex-rs/core/src/session/mod.rs")
          text = path.read_text()
          anchor = "                let (permissions, scope) = match decision {\n"
          anchor_pos = text.index(anchor)
          start = text.index("                let response = RequestPermissionsResponse {\n", anchor_pos)
          end_marker = "        let _elicitation = self.services.elicitations.register();\n"
          end = text.index(end_marker, start)
          replacement = "\n".join([
              "                let response = RequestPermissionsResponse {",
              "                    permissions,",
              "                    scope,",
              "                    strict_auto_review: false,",
              "                };",
              "                let response = Self::normalize_request_permissions_response(",
              "                    requested_permissions,",
              "                    response,",
              "                    &context,",
              "                );",
              "                self.record_granted_request_permissions_for_turn(",
              "                    &response,",
              "                    &environment.selection,",
              "                    originating_turn_state.as_ref(),",
              "                )",
              "                .await;",
              "                return Some(response);",
              "            }",
              "        }",
              "",
          ]) + "\n"
          text = text[:start] + replacement + text[end:]
          notify_old = "                    &entry.environment,\n                    originating_turn_state.as_ref(),"
          notify_new = "                    &entry.environment.selection,\n                    originating_turn_state.as_ref(),"
          if text.count(notify_old) != 1:
              raise SystemExit(f"expected one legacy notify call, found {text.count(notify_old)}")
          path.write_text(text.replace(notify_old, notify_new, 1))
          PY

          git config user.name 'freecodex-fix-bot'
          git config user.email 'freecodex-fix-bot@users.noreply.github.com'
          git add codex-rs/core/src/session/mod.rs
          git commit -m 'fix(core): resolve request permissions merge conflict'
          git push origin HEAD:freecodex
